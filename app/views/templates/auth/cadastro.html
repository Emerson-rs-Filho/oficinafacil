{% extends "base.html" %}
{% block titulo %}Cadastro{% endblock %}
{% block conteudo %}
<div class="cartao cartao-auth">
  <h1>Criar conta</h1>
  <p class="sub">Cadastre o usuário que vai operar o sistema</p>
  <form method="post">
    <label>Nome
      <input type="text" name="nome" required value="{{ request.form.get('nome', '') }}">
    </label>
    <label>E-mail
      <input type="email" name="email" required value="{{ request.form.get('email', '') }}">
    </label>
    <label>Senha (mínimo 6 caracteres)
      <input type="password" name="senha" minlength="6" required>
    </label>
    <button type="submit" class="btn btn-primario btn-bloco">Cadastrar</button>
  </form>
  <p class="rodape-auth">Já tem conta? <a href="{{ url_for('auth.login') }}">Entrar</a></p>
</div>
{% endblock %}
